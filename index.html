<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عرض المحتوى</title><style>body{text-align:center;background:#0f172a;color:#fff;padding:25px;font-family:Tahoma;margin:0}.box{max-width:500px;margin:30px auto;background:#1e293b;padding:25px;border-radius:15px}img{max-width:100%;border-radius:10px;margin:10px auto;display:block}input{padding:12px;border-radius:8px;border:none;width:80%;font-size:15px;text-align:center}button{padding:10px 25px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:12px}</style></head><body><div id="lk" class="box" style="display:none"><h3>🔒 هذا المحتوى محمي بكلمة مرور</h3><input id="pi" type="password" placeholder="أدخل كلمة المرور"><br><button onclick="unlk()">فتح المحتوى</button></div><div id="ct" class="box" style="display:none;background:#fff;color:#0f172a;word-break:break-word"></div><script>const p=new URLSearchParams(location.search),u=p.get("u"),t=p.get("t"),k=p.get("k");function show(){document.getElementById("lk").style.display="none";const c=document.getElementById("ct");c.style.display="block";if(u){u.split(",").forEach(x=>{const m=document.createElement("img");m.src=x;c.appendChild(m)})}else if(t){c.innerHTML=decodeURIComponent(t).replace(/\n/g,"<br>")}}function unlk(){if(btoa(unescape(encodeURIComponent(document.getElementById("pi").value)))===k)show();else alert("كلمة المرور خاطئة!")}if(k)document.getElementById("lk").style.display="block";else show();</script></body></html>
