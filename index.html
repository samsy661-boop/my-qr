<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Tahoma;text-align:center;background:#f4f4f9;padding:20px}.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:15px}img{max-width:100%;border-radius:10px;margin-top:15px}</style></head><body><div class="box"><h2>أهلاً بك في موقعي الخاص</h2><p id="s">جاري تحميل الصورة...</p><img id="i" style="display:none"></div><script>const p=new URLSearchParams(location.search).get("img");if(p){const m=document.getElementById("i");m.src="https://raw.github://usercontent.com"+p;m.onload=()=>{document.getElementById("s").remove();m.style.display="block"}}</script></body></html>
