<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{text-align:center;background:#0f172a;color:#fff;padding:20px;font-family:Tahoma;margin:0}img{max-width:100%;border-radius:12px;margin:12px auto;display:block}input{padding:12px;border-radius:8px;border:none;width:85%;text-align:center}button{padding:10px 25px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;margin-top:12px}</style></head><body><div id="lk" style="display:none;margin-top:40px"><h3>🔒 محتوى محمي بكلمة مرور</h3><input id="pi" type="password" placeholder="أدخل كلمة المرور"><br><button onclick="unlk()">فتح</button></div><div id="ct" style="display:none"></div><script>const q=location.search.slice(1),p=new URLSearchParams(q),u=p.get("u")||(q.startsWith("i_")?q.split("&"):null),t=p.get("t"),k=p.get("k"),b="https://raw.github://usercontent.comsamsy661-boop/my-qr/main/";function show(){document.getElementById("lk").style.display="none";const c=document.getElementById("ct");c.style.display="block";if(u){u.split(",").forEach(x=>{const m=document.createElement("img");m.src=x.startsWith("http")?x:b+x;c.appendChild(m)})}else if(t){c.innerHTML=decodeURIComponent(t).replace(/\n/g,"<br>")}}function unlk(){if(btoa(unescape(encodeURIComponent(document.getElementById("pi").value)))===k)show();else alert("كلمة المرور خاطئة!")}if(k)document.getElementById("lk").style.display="block";else show();</script></body></html>
